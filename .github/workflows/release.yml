name: Release PonWrt

on:
  # 每 3 天早上 5:15（北京时间）检查一次；该提交已构建过就只刷新缓存，不重复编译
  schedule:
    - cron: '15 21 */3 * *'
  # 手动编译
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag（留空则自动生成 PonWrt-<日期>-<短提交>）'
        required: false
        type: string
      prerelease:
        description: '标记为 prerelease'
        required: false
        default: false
        type: boolean
      force:
        description: '忽略“该提交已构建”的判断，强制编译'
        required: false
        default: true
        type: boolean
      variants:
        description: '代理变体，逗号分隔（可选 nikki / homeproxy / dae）'
        required: false
        default: 'nikki,homeproxy,dae'
        type: string

# actions: write 用于清理被取代的缓存
permissions:
  actions: write
  contents: read

concurrency:
  group: release-ponwrt
  cancel-in-progress: false

jobs:
  prepare:
    name: 检查提交与构建标记
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      sha: ${{ steps.values.outputs.sha }}
      short: ${{ steps.values.outputs.short }}
      date: ${{ steps.values.outputs.date }}
      tag: ${{ steps.decide.outputs.tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: 计算构建标识
        id: values
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(TZ=UTC-8 date +'%Y.%m.%d-%H.%M.%S')" >> "$GITHUB_OUTPUT"

      - name: 计算构建矩阵（机型 × 代理变体）
        id: matrix
        env:
          VARIANTS_INPUT: ${{ inputs.variants }}
        run: |
          variants="${VARIANTS_INPUT:-nikki,homeproxy,dae}"
          variants="${variants// /}"
          IFS=',' read -r -a VARIANT_LIST <<< "$variants"
          matrix="["
          count=0
          for target in an7581 an7583; do
            for variant in "${VARIANT_LIST[@]}"; do
              [ -n "$variant" ] || continue
              case "$variant" in
                nikki|homeproxy|dae) ;;
                *) echo "未知变体：$variant（可选 nikki/homeproxy/dae）" >&2; exit 1 ;;
              esac
              matrix="${matrix}{\"target\":\"$target\",\"variant\":\"$variant\"},"
              count=$((count + 1))
            done
          done
          if [ "$count" -eq 0 ]; then
            echo "没有可构建的变体，请检查 variants 输入" >&2
            exit 1
          fi
          matrix="${matrix%,}]"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "本次矩阵：$matrix"

      - name: 检查该提交是否已构建
        id: built
        uses: actions/cache/restore@v4
        with:
          path: .built-state/ponwrt
          key: ponwrt-built-${{ steps.values.outputs.sha }}
          lookup-only: true

      - name: 上游漂移提示
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          status=$(gh api "repos/pbs05/ponwrt/compare/master...${{ github.repository_owner }}:master" --jq .status 2>/dev/null)
          echo "upstream=$(gh api repos/pbs05/ponwrt/commits/master --jq .sha 2>/dev/null)"
          case "$status" in
            identical) note="与上游 pbs05/ponwrt 完全一致" ;;
            ahead)     note="本地比上游多出提交（就是我们的改动）" ;;
            behind)    note="⚠️ 上游有新提交，本地落后；需要在 GitHub 上 Sync fork 后再构建" ;;
            diverged)  note="⚠️ 本地与上游都有新提交；需要先 Sync fork / 处理冲突" ;;
            *)         note="未知（$status）" ;;
          esac
          echo "上游状态：$note"
          {
            echo "### PonWrt 构建准备"
            echo ""
            echo "- 提交：\`${{ steps.values.outputs.sha }}\`"
            echo "- 上游状态：$note"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 决定是否编译
        id: decide
        env:
          HIT: ${{ steps.built.outputs.cache-hit }}
          FORCE: ${{ inputs.force }}
          TAG_INPUT: ${{ inputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$TAG_INPUT" ]; then
            tag="$TAG_INPUT"
          else
            tag="PonWrt-${{ steps.values.outputs.date }}-${{ steps.values.outputs.short }}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = "workflow_dispatch" ] && [ "$FORCE" = "true" ]; then
            echo "手动强制编译"
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif [ "$HIT" = "true" ]; then
            echo "提交 ${{ steps.values.outputs.short }} 已构建过，本次只刷新缓存"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "检测到尚未构建的提交，开始编译"
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  # 不编译时，用 lookup-only 访问一次缓存，避免超过 7 天被 GitHub 回收
  refresh:
    name: 刷新缓存 ${{ matrix.target }}
    needs: prepare
    if: needs.prepare.outputs.build != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - an7581
          - an7583
    env:
      CACHE_BASE: ponwrt-${{ matrix.target }}
    steps:
      - name: 访问工具链缓存
        uses: actions/cache/restore@v4
        with:
          path: staging_dir
          key: ${{ env.CACHE_BASE }}-toolchain-${{ needs.prepare.outputs.sha }}
          restore-keys: ${{ env.CACHE_BASE }}-toolchain-
          lookup-only: true

      - name: 访问编译器缓存
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ env.CACHE_BASE }}-ccache-${{ needs.prepare.outputs.sha }}
          restore-keys: ${{ env.CACHE_BASE }}-ccache-
          lookup-only: true

      - name: 访问源码包缓存
        uses: actions/cache/restore@v4
        with:
          path: dl
          key: ponwrt-dl-${{ hashFiles('feeds.conf.default', 'configs/*.config', 'configs/variants/*.config') }}
          restore-keys: ponwrt-dl-
          lookup-only: true

  build:
    name: 编译 ${{ matrix.target }}-${{ matrix.variant }}
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    # 单个变体失败不影响其他变体；是否算整体成功由最后的汇总任务判断
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # 机型 × 变体，由 prepare 生成；两台设备各出 nikki / homeproxy / dae 三份固件
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      CACHE_BASE: ponwrt-${{ matrix.target }}
      BUILD_DATE: ${{ needs.prepare.outputs.date }}
      BUILD_HASH: ${{ needs.prepare.outputs.short }}
      VARIANT: ${{ matrix.variant }}
      # 仓库的 Actions cache 配额只有 10 GiB，而 ccache 单个目录默认上限 5 GiB。
      # 不限制体积的话，两份工具链 + 一份源码包 + 三变体的 .ccache 会把配额挤爆，
      # 老缓存被 LRU 淘汰后下次构建又要从头编译。
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      # ---------- 三层缓存：源码包 / 工具链 / 编译器缓存 ----------
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: dl
          key: ponwrt-dl-${{ hashFiles('feeds.conf.default', 'configs/*.config', 'configs/variants/*.config') }}
          restore-keys: ponwrt-dl-

      - name: Restore toolchain cache
        id: restore-toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            staging_dir/host*
            staging_dir/tool*
          key: ${{ env.CACHE_BASE }}-toolchain-${{ needs.prepare.outputs.sha }}
          restore-keys: ${{ env.CACHE_BASE }}-toolchain-

      - name: Restore compiler cache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ env.CACHE_BASE }}-ccache-${{ needs.prepare.outputs.sha }}
          restore-keys: ${{ env.CACHE_BASE }}-ccache-

      - name: Prepare restored caches
        run: |
          mkdir -p .ccache
          if [ -d staging_dir ]; then
            find staging_dir -type d -name stamp -not -path "*target*" |
              while read -r dir; do find "$dir" -type f -exec touch {} +; done
            echo "已复用工具链缓存（stamp 时间戳已刷新）"
          else
            echo "未命中工具链缓存，本次完整构建工具链"
          fi
          ccache --version | head -1
          ccache -p | grep -Ei 'max.?size|compression' || true
          ccache -s | head -3 || true

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add Airoha NPU status app
        run: |
          git clone --depth 1 https://github.com/rchen14b/luci-app-airoha-npu.git /tmp/airoha-npu
          mkdir -p package/luci-app-airoha-npu
          cp -r /tmp/airoha-npu/Makefile /tmp/airoha-npu/htdocs /tmp/airoha-npu/root \
                /tmp/airoha-npu/po /tmp/airoha-npu/LICENSE package/luci-app-airoha-npu/
          # Some DTS revisions (e.g. Nokia XG-040G-MF on PonWrt) omit the NPU
          # firmware-name property, which makes the status page report an unknown
          # firmware version. Fall back to scanning the firmware directory.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("package/luci-app-airoha-npu/root/usr/libexec/rpcd/luci.airoha_npu")
          source = path.read_text()
          anchor = 'local npu_ver="Unknown"'
          fallback = (
              'if [ -z "$npu_fw" ] || [ ! -f "$npu_fw" ]; then '
              'npu_fw=$(ls -1 /lib/firmware/airoha/*rv32*.bin 2>/dev/null | head -1); fi\n'
          )
          if "rv32*.bin" not in source and anchor in source:
              path.write_text(source.replace("\t" + anchor, "\t" + fallback + "\t" + anchor, 1))
              print("patched NPU firmware-name fallback")
          PY
          bash -n package/luci-app-airoha-npu/root/usr/libexec/rpcd/luci.airoha_npu

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

      - name: Configure ${{ matrix.target }}-${{ matrix.variant }}
        run: |
          # kconfig.pl 是前缀表达式：三份配置要写成 `+ a + b c`（后者优先合并），
          # 写成 `+ a b c` 会直接 Parse error
          ./scripts/kconfig.pl + \
            "configs/${{ matrix.target }}.config" \
            + configs/release.config \
            "configs/variants/${{ matrix.variant }}.config" > .config
          make defconfig
          grep -E '^CONFIG_(CCACHE|DEVEL|AUTOREBUILD|PACKAGE_luci-app-nikki|PACKAGE_luci-app-homeproxy|PACKAGE_luci-app-daed|PACKAGE_sing-box|PACKAGE_mihomo-meta|PACKAGE_luci-app-airoha-npu|KERNEL_DEBUG_INFO_BTF|KERNEL_BPF_EVENTS)=' .config || true

      - name: 校验变体配置
        run: |
          case "$VARIANT" in
            nikki)     want="luci-app-nikki";     avoid="luci-app-homeproxy luci-app-daed" ;;
            homeproxy) want="luci-app-homeproxy"; avoid="luci-app-nikki luci-app-daed" ;;
            dae)       want="luci-app-daed";      avoid="luci-app-nikki luci-app-homeproxy luci-app-dae" ;;
          esac
          if ! grep -q "^CONFIG_PACKAGE_${want}=y$" .config; then
            echo "❌ 变体 $VARIANT 未启用 $want" >&2
            exit 1
          fi
          for pkg in $avoid; do
            if grep -q "^CONFIG_PACKAGE_${pkg}=y$" .config; then
              echo "❌ 变体 $VARIANT 不应包含 $pkg" >&2
              exit 1
            fi
          done
          if ! grep -q "^CONFIG_PACKAGE_luci-app-airoha-npu=y$" .config; then
            echo "❌ 缺少 NPU 状态页" >&2
            exit 1
          fi
          # ccache 是这套缓存方案的地基；它悄悄失效的话构建只是变慢，不会报错，所以在这里卡一道
          if ! grep -qx 'CONFIG_CCACHE=y' .config; then
            echo "❌ CONFIG_CCACHE 未生效（检查 config/Config-devel.in 是否又把 ccache 关进 DEVEL）" >&2
            exit 1
          fi
          if [ "$VARIANT" = "dae" ]; then
            for opt in CONFIG_KERNEL_DEBUG_INFO_BTF CONFIG_KERNEL_BPF_EVENTS; do
              if ! grep -q "^${opt}=y$" .config; then
                echo "❌ dae 变体缺少 $opt" >&2
                exit 1
              fi
            done
          fi
          echo "✅ 变体 $VARIANT 配置校验通过"

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build ${{ matrix.target }}-${{ matrix.variant }}
        run: make -j"$(nproc)"

      - name: Compiler cache statistics
        if: always()
        run: ccache -s || true

      - name: 整理固件并统一命名
        run: |
          set -e
          mkdir -p upload
          SRC="bin/targets/airoha/${{ matrix.target }}"
          rm -rf "$SRC/packages" "$SRC"/*.json "$SRC"/*.buildinfo "$SRC"/sha256sums 2>/dev/null || true
          for f in "$SRC"/*; do
            [ -f "$f" ] || continue
            base="$(basename "$f")"
            case "$base" in
              *.itb|*.bin|*.fip) ;;
              *) continue ;;
            esac
            stem="${base%.*}"
            ext="${base##*.}"
            stem="${stem#ponwrt-airoha-${{ matrix.target }}-}"
            stem="${stem//_/-}"
            cp -f "$f" "upload/ponwrt-${{ matrix.target }}-${stem}-${VARIANT}-${BUILD_DATE}-${BUILD_HASH}.${ext}"
          done
          # 附上本次 .config，方便回查变体到底装了什么
          cp -f .config "upload/ponwrt-${{ matrix.target }}-${VARIANT}-config-${BUILD_DATE}-${BUILD_HASH}.txt"
          echo "=== 本次产物 ==="
          ls -lh upload

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}-${{ matrix.variant }}-${{ needs.prepare.outputs.short }}
          path: upload/*
          if-no-files-found: error
          retention-days: 7

      - name: Save toolchain cache
        if: steps.restore-toolchain.outputs.cache-hit != 'true'
        # 同一机型的不同变体共用一份工具链缓存，谁先保存都可以，落败的任务忽略报错
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          key: ${{ env.CACHE_BASE }}-toolchain-${{ needs.prepare.outputs.sha }}
          path: |
            staging_dir/host*
            staging_dir/tool*

      - name: Save compiler cache
        if: steps.restore-ccache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          key: ${{ env.CACHE_BASE }}-ccache-${{ needs.prepare.outputs.sha }}
          path: .ccache

      - name: Cleanup superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          delete_old_caches() {
            local PREFIX="$1" CURRENT="$2"
            while IFS=$'\t' read -r ID KEY; do
              if [[ "$KEY" == "$PREFIX"* && "$KEY" != "$CURRENT" ]]; then
                gh cache delete "$ID" 2>/dev/null || echo "skip $KEY"
              fi
            done < <(gh cache list --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv')
          }
          delete_old_caches "$CACHE_BASE-toolchain-" "$CACHE_BASE-toolchain-${{ needs.prepare.outputs.sha }}"
          delete_old_caches "$CACHE_BASE-ccache-" "$CACHE_BASE-ccache-${{ needs.prepare.outputs.sha }}"
          # 早期版本按目标各存了一份源码包缓存（各 2.4 GiB），现已改为共享一份
          delete_old_caches "$CACHE_BASE-dl-" ""
          # 共享的源码包缓存：键跟着 feeds/配置内容走，配置一变旧键就没用了
          delete_old_caches "ponwrt-dl-" "ponwrt-dl-${{ hashFiles('feeds.conf.default', 'configs/*.config', 'configs/variants/*.config') }}"
          echo "superseded caches cleanup done"

  release:
    name: 发布 ${{ needs.prepare.outputs.tag }}
    needs:
      - prepare
      - build
    if: needs.prepare.outputs.build == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      complete: ${{ steps.complete.outputs.complete }}
      missing: ${{ steps.complete.outputs.missing }}
    steps:
      - name: Download firmware archives
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: 检查产物是否齐全
        id: complete
        env:
          MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          missing=""
          while read -r pair; do
            [ -n "$pair" ] || continue
            matches=(release/*"${pair}"-config-*.txt)
            if [ ! -e "${matches[0]}" ]; then
              missing="$missing $pair"
            fi
          done < <(printf '%s' "$MATRIX" | jq -r '.[] | "\(.target)-\(.variant)"')

          if [ -n "$missing" ]; then
            echo "complete=false" >> "$GITHUB_OUTPUT"
            echo "missing=$missing" >> "$GITHUB_OUTPUT"
            echo "⚠️ 以下变体没有产物，构建失败：$missing"
          else
            echo "complete=true" >> "$GITHUB_OUTPUT"
            echo "missing=" >> "$GITHUB_OUTPUT"
            echo "✅ 全部变体都有产物"
          fi
          ls -lh release || true

      - name: Create checksums
        working-directory: release
        run: |
          sha256sum * > sha256sums
          ls -lh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
          MISSING: ${{ steps.complete.outputs.missing }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*
            --repo "$GITHUB_REPOSITORY"
            --target "${{ needs.prepare.outputs.sha }}"
            --title "PonWrt $RELEASE_TAG"
            --generate-notes
          )
          if [ -n "$MISSING" ]; then
            args+=(--notes "⚠️ 本次缺少这些变体（构建失败，详见 Actions 日志）：$MISSING")
          fi
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

  status:
    name: 汇总构建结果
    needs:
      - prepare
      - build
      - release
    if: always() && needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 结果
        env:
          COMPLETE: ${{ needs.release.outputs.complete }}
          MISSING: ${{ needs.release.outputs.missing }}
        run: |
          {
            echo "### PonWrt ${{ needs.prepare.outputs.tag }}"
            echo ""
            if [ "$COMPLETE" = "true" ]; then
              echo "- 全部变体构建成功"
            else
              echo "- 缺失变体：${MISSING:-未知（发布任务未执行）}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$COMPLETE" != "true" ]; then
            echo "::error::变体构建失败：${MISSING:-未知（发布任务未执行）}"
            exit 1
          fi

  mark-built:
    name: 记录已构建提交
    needs:
      - prepare
      - build
      - release
    # 只有所有变体都出齐才记录，否则下次定时构建仍会重试
    if: needs.prepare.outputs.build == 'true' && needs.release.outputs.complete == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: 保存构建标记
        run: |
          mkdir -p .built-state
          echo "${{ needs.prepare.outputs.sha }}" > .built-state/ponwrt

      - name: Save build marker
        uses: actions/cache/save@v4
        with:
          path: .built-state/ponwrt
          key: ponwrt-built-${{ needs.prepare.outputs.sha }}
