name: Release PonWrt

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      prerelease:
        description: Mark as prerelease
        required: true
        default: true
        type: boolean

# actions: write 用于构建结束后清理被新版取代的缓存
permissions:
  actions: write
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: release
    strategy:
      fail-fast: false
      matrix:
        target:
          - an7581
          - an7583
    env:
      CACHE_BASE: ponwrt-${{ matrix.target }}

    steps:
      - uses: actions/checkout@v6

      - name: Free build space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo apt-get clean

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk \
            gettext git g++-multilib gcc-multilib gperf help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev lld llvm ninja-build p7zip-full patch pkgconf \
            python3 python3-docutils python3-pip python3-ply python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo \
            uglifyjs unzip wget xmlto xxd zlib1g-dev zstd

      # ---------- 三层缓存：源码包 / 工具链 / 编译器缓存 ----------
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: dl
          key: ${{ env.CACHE_BASE }}-dl-${{ hashFiles('feeds.conf.default', 'configs/*.config') }}
          restore-keys: ${{ env.CACHE_BASE }}-dl-

      - name: Restore toolchain cache
        id: restore-toolchain
        uses: actions/cache/restore@v4
        with:
          path: |
            staging_dir/host*
            staging_dir/tool*
          key: ${{ env.CACHE_BASE }}-toolchain-${{ github.sha }}
          restore-keys: ${{ env.CACHE_BASE }}-toolchain-

      - name: Restore compiler cache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ env.CACHE_BASE }}-ccache-${{ github.sha }}
          restore-keys: ${{ env.CACHE_BASE }}-ccache-

      - name: Prepare restored caches
        run: |
          mkdir -p .ccache
          if [ -d staging_dir ]; then
            # 让 make 认为 host 工具与交叉工具链已经构建完成，跳过这 30-50 分钟
            find staging_dir -type d -name stamp -not -path "*target*" |
              while read -r dir; do find "$dir" -type f -exec touch {} +; done
            echo "已复用工具链缓存（stamp 时间戳已刷新）"
          else
            echo "未命中工具链缓存，本次完整构建工具链"
          fi
          ccache --version | head -1
          ccache -s | head -3 || true

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add Airoha NPU status app
        run: |
          git clone --depth 1 https://github.com/rchen14b/luci-app-airoha-npu.git /tmp/airoha-npu
          mkdir -p package/luci-app-airoha-npu
          cp -r /tmp/airoha-npu/Makefile /tmp/airoha-npu/htdocs /tmp/airoha-npu/root \
                /tmp/airoha-npu/po /tmp/airoha-npu/LICENSE package/luci-app-airoha-npu/
          # Some DTS revisions (e.g. Nokia XG-040G-MF on PonWrt) omit the NPU
          # firmware-name property, which makes the status page report an unknown
          # firmware version. Fall back to scanning the firmware directory.
          python3 - <<'PY'
          from pathlib import Path

          path = Path("package/luci-app-airoha-npu/root/usr/libexec/rpcd/luci.airoha_npu")
          source = path.read_text()
          anchor = 'local npu_ver="Unknown"'
          fallback = (
              'if [ -z "$npu_fw" ] || [ ! -f "$npu_fw" ]; then '
              'npu_fw=$(ls -1 /lib/firmware/airoha/*rv32*.bin 2>/dev/null | head -1); fi\n'
          )
          if "rv32*.bin" not in source and anchor in source:
              path.write_text(source.replace("\t" + anchor, "\t" + fallback + "\t" + anchor, 1))
              print("patched NPU firmware-name fallback")
          PY
          bash -n package/luci-app-airoha-npu/root/usr/libexec/rpcd/luci.airoha_npu

      - name: Load repository signing key
        env:
          PONWRT_APK_PRIVATE_KEY: ${{ secrets.PONWRT_APK_PRIVATE_KEY }}
        run: |
          if [ -n "$PONWRT_APK_PRIVATE_KEY" ]; then
            umask 077
            printf '%s\n' "$PONWRT_APK_PRIVATE_KEY" > private-key.pem
            openssl ec -in private-key.pem -pubout -out public-key.pem
          fi

      - name: Configure ${{ matrix.target }}
        run: |
          ./scripts/kconfig.pl + \
            "configs/${{ matrix.target }}.config" \
            configs/release.config > .config
          make defconfig
          grep -E '^CONFIG_(CCACHE|PACKAGE_luci-app-npu|PACKAGE_luci-app-nikki)=' .config || true

      - name: Download sources
        run: make download -j"$(nproc)"

      - name: Build ${{ matrix.target }}
        run: make -j"$(nproc)"

      - name: Compiler cache statistics
        if: always()
        run: ccache -s || true

      - name: Pack ${{ matrix.target }}
        run: |
          mkdir release
          tar --zstd -cf "release/ponwrt-${{ matrix.target }}.tar.zst" \
            -C bin/targets/airoha "${{ matrix.target }}"

      - name: Upload ${{ matrix.target }}
        uses: actions/upload-artifact@v4
        with:
          name: ponwrt-${{ matrix.target }}
          path: release/*.tar.zst
          if-no-files-found: error
          retention-days: 7

      - name: Save toolchain cache
        if: steps.restore-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ env.CACHE_BASE }}-toolchain-${{ github.sha }}
          path: |
            staging_dir/host*
            staging_dir/tool*

      - name: Save compiler cache
        if: steps.restore-ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ env.CACHE_BASE }}-ccache-${{ github.sha }}
          path: .ccache

      - name: Cleanup superseded caches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          delete_old_caches() {
            local PREFIX="$1" CURRENT="$2"
            while IFS=$'\t' read -r ID KEY; do
              if [[ "$KEY" == "$PREFIX"* && "$KEY" != "$CURRENT" ]]; then
                gh cache delete "$ID" 2>/dev/null || echo "skip $KEY"
              fi
            done < <(gh cache list --limit 100 --json id,key --jq '.[] | [.id, .key] | @tsv')
          }
          delete_old_caches "$CACHE_BASE-toolchain-" "$CACHE_BASE-toolchain-${{ github.sha }}"
          delete_old_caches "$CACHE_BASE-ccache-" "$CACHE_BASE-ccache-${{ github.sha }}"
          echo "superseded caches cleanup done"

  release:
    name: Create release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download firmware archives
        uses: actions/download-artifact@v4
        with:
          pattern: ponwrt-*
          path: release
          merge-multiple: true

      - name: Create checksums
        working-directory: release
        run: sha256sum *.tar.zst > sha256sums

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          args=(
            "$RELEASE_TAG"
            release/*.tar.zst
            release/sha256sums
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "PonWrt $RELEASE_TAG"
            --generate-notes
          )
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"
