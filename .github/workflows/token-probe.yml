name: Token Probe

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 探测写权限
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          echo "=== 1) generate-notes ==="
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="probe-$GITHUB_RUN_ID" -f target_commitish="$GITHUB_SHA" \
            --jq '.name' 2>&1 | head -6
          echo "=== 2) 建 draft release ==="
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="probe-token-$GITHUB_RUN_ID" -f name="probe-token-$GITHUB_RUN_ID" \
            -F draft=true -f target_commitish="$GITHUB_SHA" \
            --jq '.id, .tag_name' 2>&1 | head -4
          echo "=== 3) 发布（draft=false）==="
          ID=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/probe-token-$GITHUB_RUN_ID" --jq .id 2>/dev/null)
          echo "release id=$ID"
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$ID" -F draft=false -f name="probe-token-$GITHUB_RUN_ID" --jq '.tag_name, .draft' 2>&1 | head -4
          echo "=== 4) gh release create 原样复现 ==="
          gh release create "probe-cli-$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "probe-cli-$GITHUB_RUN_ID" --generate-notes 2>&1 | head -6
