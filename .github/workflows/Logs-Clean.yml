# 每周一 05:05（北京时间 = 周日 21:05 UTC）清理已完成的构建日志
name: Logs-Clean

on:
  schedule:
    - cron: '5 21 * * 0'
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  logs_clean:
    name: 清理构建日志
    runs-on: ubuntu-latest
    steps:
      - name: Delete Workflow Runs
        uses: ophub/delete-releases-workflows@main
        with:
          gh_token: ${{ secrets.GITHUB_TOKEN }}
          delete_releases: false
          delete_workflows: true
          # 保留最近 7 天的运行记录（含日志）；设 0 表示全部删除
          workflows_keep_day: 7
